name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./build _serve
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _serve
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
